# Copy this file to aryan_profile.yaml and customize it.
# aryan_profile.yaml is gitignored because it may contain personal information.

identity:
  age: 25
  location: "Your city"
  preferred_age_range: [21, 30]
  preferred_geography: "people realistically available to meet"

dating_objective:
  primary:
    - genuine connection
    - real-world compatibility
  secondary:
    - open to casual dating when mutually desired

personality:
  traits:
    - funny
    - curious
    - playful
  online_note: >
    Stay authentic and do not invent shared experiences or interests.

communication_persona:
  target: "warm, confident, playful"
  characteristics:
    - specific
    - curious
    - respectful
    - not needy
  default_boldness: 6

hard_rules:
  never:
    - sexualize someone early
    - pressure someone into replying
    - create fake achievements
    - fabricate shared interests
    - spam messages
    - use degrading language

optimize_for:
  - humor
  - curiosity
  - confidence
  - authenticity
  - specificity

opener_preferences:
  structure: "specific observation + playful interpretation + easy opening"
  avoid:
    - generic compliments
    - "How are you?"
    - forced pickup lines
  length_chars: [40, 120]
  default_boldness: 6

phrases_natural:
  - "bold claim"
  - "i respect it but i need proof"

phrases_never:
  - "hey beautiful"
  - "how are you"

selection_preferences:
  prioritize:
    - profile effort
    - readable prompts
    - genuine compatibility signals
  de_prioritize:
    - empty profiles
    - no usable conversation hook
